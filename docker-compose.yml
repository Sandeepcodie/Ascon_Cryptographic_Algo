services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: ascon-mqtt
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/passwords:/mosquitto/config/passwords:ro
      - ./deploy/mosquitto/acl:/mosquitto/config/acl:ro
      - ./deploy/mosquitto/certs:/mosquitto/config/certs:ro
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log
    restart: unless-stopped

volumes:
  mqtt_data:
  mqtt_logs:
